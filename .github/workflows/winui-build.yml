name: Build WinUI

on:
  push:
    paths:
      - "WinUIBatchPacker/**"
      - ".github/workflows/winui-build.yml"
  pull_request:
    paths:
      - "WinUIBatchPacker/**"
      - ".github/workflows/winui-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winui-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win-x64:
    name: Build compact win-x64
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh
        working-directory: WinUIBatchPacker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show build environment
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore WinUIBatchPacker.csproj -r win-x64 -p:Platform=x64

      - name: Publish WinUI app
        run: >-
          dotnet publish WinUIBatchPacker.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --no-restore
          -p:Platform=x64
          -p:PublishSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:ContinuousIntegrationBuild=true
          --output "${{ github.workspace }}\artifacts\WinUIBatchPacker-win-x64"

      - name: Verify publish output
        run: |
          $exe = "${{ github.workspace }}\artifacts\WinUIBatchPacker-win-x64\WinUIBatchPacker.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected executable was not generated: $exe"
          }
          $files = @(Get-ChildItem "${{ github.workspace }}\artifacts\WinUIBatchPacker-win-x64" -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].Extension -ne ".exe") {
            throw "Single-file publish expected exactly one EXE, got $($files.Count) files"
          }
          if ($files[0].Length -gt 50MB) {
            throw "Framework-dependent EXE is unexpectedly large: $($files[0].Length) bytes"
          }
          Write-Host "Framework-dependent single EXE size: $($files[0].Length) bytes"
          Get-ChildItem "${{ github.workspace }}\artifacts\WinUIBatchPacker-win-x64" |
            Select-Object Name, Length

      - name: Upload win-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinUIBatchPacker-win-x64-${{ github.run_number }}
          path: artifacts/WinUIBatchPacker-win-x64
          if-no-files-found: error
          retention-days: 14
